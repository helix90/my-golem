[
  ["_comment1", "SearXNG (or searx): sums, conversions and web searches, through its JSON API"],
  ["_comment2", "Set SEARX_URL to the instance, e.g. http://searx:8080. Its settings.yml must allow the json format:"],
  ["_comment3", "  search: formats: [html, json]  (otherwise it answers 403 Forbidden)"],
  ["_comment4", "Sums use its Calculator plugin, conversions its unit converter and currency engine"],
  ["_comment5", "Behind basic auth? Add [\"sraix.searx_answer.username\", \"${SEARX_USERNAME}\"] and a password, likewise for searx_search"],
  ["_comment6", "Without SEARX_URL, sums fall back to Wikipedia's answer and web searches say they're not set up"],

  ["sraix.searx_answer.handler", "searx"],
  ["sraix.searx_answer.operation", "answer"],
  ["sraix.searx_answer.urltemplate", "${SEARX_URL}/search"],
  ["sraix.searx_answer.timeout", "10"],
  ["sraix.searx_answer.fallback", "Searx unavailable"],

  ["sraix.searx_search.handler", "searx"],
  ["sraix.searx_search.operation", "search"],
  ["sraix.searx_search.urltemplate", "${SEARX_URL}/search"],
  ["sraix.searx_search.timeout", "15"],
  ["sraix.searx_search.fallback", "Searx unavailable"]
]
