[
  ["_comment1", "CalDAV/Radicale Calendar Integration for SRAIX"],
  ["_comment2", "Format: JSON array of [key, value] pairs - [[\"key\", \"value\"], ...]"],
  ["_comment3", ""],
  ["_comment4", "Radicale is a lightweight CalDAV/CardDAV server: https://radicale.org/"],
  ["_comment5", "Any CalDAV server works; recurring events need one that supports calendar-query expand, such as recent Radicale"],
  ["_comment6", ""],
  ["_comment7", "Environment variables:"],
  ["_comment8", "  RADICALE_URL       - server URL (default http://localhost:5232)"],
  ["_comment9", "  RADICALE_USER      - user name, used for the calendar path and to log in"],
  ["_comment10", "  RADICALE_PASSWORD  - password (leave unset if the server has no authentication)"],
  ["_comment11", "  RADICALE_CALENDAR  - calendar used until a session picks one (default personal)"],
  ["_comment12", ""],
  ["_comment13", "Each session can pick a calendar with 'use calendar work', which sets the 'calendar' predicate;"],
  ["_comment14", "param.calendar fills the URL's {calendar} from it, and default.calendar applies when it is not set."],
  ["_comment15", ""],
  ["_comment16", "Services (handler caldav, see pkg/golem/caldav.go):"],
  ["_comment17", "  caldav_today  - today's events, or empty when there are none"],
  ["_comment18", "  caldav_list   - events in the next seven days, or empty when there are none"],
  ["_comment19", "  caldav_create - creates an event from text such as 'Lunch tomorrow at noon'"],
  ["_comment20", "  caldav_get    - details of the event the input names, by title or UID"],
  ["_comment21", "  caldav_delete - deletes the event the input names, by title or UID"],
  ["_comment22", "Times are in the bot's local time zone (set TZ to change it)."],
  ["_comment23", ""],

  ["_section_caldav_today", "caldav_today (today)"],
  ["sraix.caldav_today.handler", "caldav"],
  ["sraix.caldav_today.operation", "today"],
  ["sraix.caldav_today.urltemplate", "${RADICALE_URL:-http://localhost:5232}/${RADICALE_USER}/{calendar}/"],
  ["sraix.caldav_today.param.calendar", "calendar"],
  ["sraix.caldav_today.default.calendar", "${RADICALE_CALENDAR:-personal}"],
  ["sraix.caldav_today.username", "${RADICALE_USER}"],
  ["sraix.caldav_today.password", "${RADICALE_PASSWORD:-}"],
  ["sraix.caldav_today.timeout", "30"],
  ["sraix.caldav_today.fallback", "Unable to retrieve calendar events"],

  ["_section_caldav_list", "caldav_list (upcoming)"],
  ["sraix.caldav_list.handler", "caldav"],
  ["sraix.caldav_list.operation", "upcoming"],
  ["sraix.caldav_list.urltemplate", "${RADICALE_URL:-http://localhost:5232}/${RADICALE_USER}/{calendar}/"],
  ["sraix.caldav_list.param.calendar", "calendar"],
  ["sraix.caldav_list.default.calendar", "${RADICALE_CALENDAR:-personal}"],
  ["sraix.caldav_list.username", "${RADICALE_USER}"],
  ["sraix.caldav_list.password", "${RADICALE_PASSWORD:-}"],
  ["sraix.caldav_list.timeout", "30"],
  ["sraix.caldav_list.fallback", "Unable to retrieve calendar events"],

  ["_section_caldav_range", "caldav_range (range): a day or period, e.g. tomorrow, Friday, next week"],
  ["sraix.caldav_range.handler", "caldav"],
  ["sraix.caldav_range.operation", "range"],
  ["sraix.caldav_range.urltemplate", "${RADICALE_URL:-http://localhost:5232}/${RADICALE_USER}/{calendar}/"],
  ["sraix.caldav_range.param.calendar", "calendar"],
  ["sraix.caldav_range.default.calendar", "${RADICALE_CALENDAR:-personal}"],
  ["sraix.caldav_range.username", "${RADICALE_USER}"],
  ["sraix.caldav_range.password", "${RADICALE_PASSWORD:-}"],
  ["sraix.caldav_range.timeout", "30"],
  ["sraix.caldav_range.fallback", "Unable to retrieve calendar events"],

  ["_section_caldav_create", "caldav_create (create)"],
  ["sraix.caldav_create.handler", "caldav"],
  ["sraix.caldav_create.operation", "create"],
  ["sraix.caldav_create.urltemplate", "${RADICALE_URL:-http://localhost:5232}/${RADICALE_USER}/{calendar}/"],
  ["sraix.caldav_create.param.calendar", "calendar"],
  ["sraix.caldav_create.default.calendar", "${RADICALE_CALENDAR:-personal}"],
  ["sraix.caldav_create.username", "${RADICALE_USER}"],
  ["sraix.caldav_create.password", "${RADICALE_PASSWORD:-}"],
  ["sraix.caldav_create.timeout", "30"],
  ["sraix.caldav_create.fallback", "Failed to create calendar event"],

  ["_section_caldav_get", "caldav_get (get)"],
  ["sraix.caldav_get.handler", "caldav"],
  ["sraix.caldav_get.operation", "get"],
  ["sraix.caldav_get.urltemplate", "${RADICALE_URL:-http://localhost:5232}/${RADICALE_USER}/{calendar}/"],
  ["sraix.caldav_get.param.calendar", "calendar"],
  ["sraix.caldav_get.default.calendar", "${RADICALE_CALENDAR:-personal}"],
  ["sraix.caldav_get.username", "${RADICALE_USER}"],
  ["sraix.caldav_get.password", "${RADICALE_PASSWORD:-}"],
  ["sraix.caldav_get.timeout", "30"],
  ["sraix.caldav_get.fallback", "Event not found"],

  ["_section_caldav_delete", "caldav_delete (delete)"],
  ["sraix.caldav_delete.handler", "caldav"],
  ["sraix.caldav_delete.operation", "delete"],
  ["sraix.caldav_delete.urltemplate", "${RADICALE_URL:-http://localhost:5232}/${RADICALE_USER}/{calendar}/"],
  ["sraix.caldav_delete.param.calendar", "calendar"],
  ["sraix.caldav_delete.default.calendar", "${RADICALE_CALENDAR:-personal}"],
  ["sraix.caldav_delete.username", "${RADICALE_USER}"],
  ["sraix.caldav_delete.password", "${RADICALE_PASSWORD:-}"],
  ["sraix.caldav_delete.timeout", "30"],
  ["sraix.caldav_delete.fallback", "Failed to delete event"],

  ["_section_bot", "Bot Configuration"],
  ["bot.caldav.enabled", "true"],
  ["bot.caldav.server", "Radicale"]
]
