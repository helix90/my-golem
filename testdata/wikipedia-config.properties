[
  ["_comment1", "Wikipedia lookups: WIKIPEDIA <topic> and the phrase pack's \"what is ...\", \"who is ...\""],
  ["_comment2", "The wikipedia handler (pkg/golem/wikipedia.go) searches the API and returns the start of the best article"],
  ["_comment3", "WIKIPEDIA_URL picks another language, e.g. https://de.wikipedia.org/w/api.php"],
  ["_comment4", "Wikimedia asks clients to send a User-Agent with contact details and limits those without: set"],
  ["_comment5", "WIKIPEDIA_USER_AGENT to e.g. \"my-assistant/1.0 (you@example.com)\""],

  ["sraix.wiki_summary.handler", "wikipedia"],
  ["sraix.wiki_summary.operation", "summary"],
  ["sraix.wiki_summary.urltemplate", "${WIKIPEDIA_URL:-https://en.wikipedia.org/w/api.php}"],
  ["sraix.wiki_summary.header.User-Agent", "${WIKIPEDIA_USER_AGENT:-golem-aiml-bot/1.0}"],
  ["sraix.wiki_summary.timeout", "15"],
  ["sraix.wiki_summary.fallback", "Wikipedia unavailable"],

  ["sraix.wiki_page.handler", "wikipedia"],
  ["sraix.wiki_page.operation", "page"],
  ["sraix.wiki_page.urltemplate", "${WIKIPEDIA_URL:-https://en.wikipedia.org/w/api.php}"],
  ["sraix.wiki_page.header.User-Agent", "${WIKIPEDIA_USER_AGENT:-golem-aiml-bot/1.0}"],
  ["sraix.wiki_page.timeout", "15"],
  ["sraix.wiki_page.fallback", "Wikipedia unavailable"]
]
