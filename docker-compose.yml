services:
  # Fetches the AIML repository in AIML_REPO, if set, before the bot starts
  # (see docker/sync-aiml.sh). To pick up new commits while the bot runs:
  #   docker compose run --rm aiml-sync && docker compose restart golem-telegram
  aiml-sync:
    image: alpine/git:v2.47.2
    environment:
      - AIML_REPO=${AIML_REPO:-}
      - AIML_REF=${AIML_REF:-}
      - AIML_TOKEN=${AIML_TOKEN:-}
    entrypoint: ["sh", "/sync-aiml.sh"]
    volumes:
      - ./docker/sync-aiml.sh:/sync-aiml.sh:ro
      - my-aiml:/aiml

  golem-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      aiml-sync:
        condition: service_completed_successfully
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      # Who may use the bot (Telegram user IDs); see env.example
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      - TELEGRAM_ADMINS=${TELEGRAM_ADMINS:-}
      - TELEGRAM_ALLOW_ALL=${TELEGRAM_ALLOW_ALL:-false}
      - AIML_PATH=/app/testdata
      - VERBOSE=${VERBOSE:-false}
      - TZ=${TZ:-UTC}
      # Encrypts saved passwords and other secrets in the user store
      - USER_STORE_KEY=${USER_STORE_KEY:-}
      # SRAIX services used by the bundled AIML; leave unset to disable them
      - PIRATE_WEATHER_API_KEY=${PIRATE_WEATHER_API_KEY:-}
      - LIST_HANDLER_URL=${LIST_HANDLER_URL:-}
      - RADICALE_URL=${RADICALE_URL:-}
      - RADICALE_USER=${RADICALE_USER:-}
      - RADICALE_PASSWORD=${RADICALE_PASSWORD:-}
      - RADICALE_CALENDAR=${RADICALE_CALENDAR:-}
      # Wikipedia lookups ("what is ..."); see env.example
      - WIKIPEDIA_USER_AGENT=${WIKIPEDIA_USER_AGENT:-}
      - WIKIPEDIA_URL=${WIKIPEDIA_URL:-}
      # SearXNG: sums, conversions and web searches; see env.example
      - SEARX_URL=${SEARX_URL:-}
    volumes:
      - golem-learned:/app/learned_categories
      # The user store (users.json) and reminders (reminders.json)
      - golem-data:/app/data
      # Extra AIML, loaded with the bundled testdata. Files load in path order
      # and the last definition of a pattern wins, so zz-local can override
      # bundled categories. To use a folder on this machine instead of
      # AIML_REPO, change my-aiml to ./my-aiml (then edit and restart).
      - my-aiml:/app/testdata/zz-local:ro
      # Or, to use only your own AIML instead of the bundled testdata:
      # - ./aiml:/app/testdata:ro

volumes:
  golem-learned:
  golem-data:
  my-aiml:
